name: ngelamar
description: "Ngelamar - tracker lamaran kerja dan pendamping persiapan karier personal."
publish_to: 'none'

version: 2.32.0+250

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  url_launcher: ^6.2.5
  google_fonts: ^6.2.0
  share_plus: ^10.0.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.4
  image_picker: ^1.1.2
  http: ^1.2.1
  flutter_secure_storage: ^10.3.1
  file_picker: ^11.0.3
  excel_plus: ^2.16.0
  open_filex: ^4.7.0
  archive: ^4.1.0
  supabase_flutter: ^2.10.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  package_info_plus: ^9.0.1
  universal_html: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
    - assets/portal_logos/
    - assets/google_fonts/
