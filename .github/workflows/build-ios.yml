name: Build iOS IPA (Sideload Ready)

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    # Firebase's current Apple SDK requires Xcode 26.2 or newer.
    # The deployment target stays iOS 15, including iPhone XS on iOS 18.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Xcode and Swift versions
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          swift --version
          ls /Applications | grep Xcode

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios

      - name: Install Flutter Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Verify iPhone XS layouts
        run: flutter test test/golden/screens_golden_test.dart --plain-name 'iPhone XS layout'

      - name: Clean iOS build artifacts
        run: |
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          rm -rf build/ios
          mkdir -p build/ios/SourcePackages

      - name: Build iOS App Bundle (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          test -f build/ios/iphoneos/Runner.app/Runner
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' build/ios/iphoneos/Runner.app/Info.plist
          lipo -verify_arch arm64 build/ios/iphoneos/Runner.app/Runner
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Ngelamar-iOS-Release.ipa Payload
          unzip -t Ngelamar-iOS-Release.ipa
          shasum -a 256 Ngelamar-iOS-Release.ipa > Ngelamar-iOS-Release.ipa.sha256
          rm -rf Payload

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ngelamar-iOS-Release
          path: |
            Ngelamar-iOS-Release.ipa
            Ngelamar-iOS-Release.ipa.sha256
          if-no-files-found: error
          retention-days: 14
